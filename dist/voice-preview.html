<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karakter sesleri</title><style>body{font:17px system-ui;background:#eef8f6;color:#24554d;margin:0;padding:28px}main{max-width:900px;margin:auto}h1{font-size:30px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}article{padding:22px;background:white;border-radius:24px}audio{width:100%;margin:8px 0}small{display:block;color:#57756f}a{color:#24554d}</style><main><a href="./">← Programa dön</a><h1>Karakter seslerini dinle</h1><p id="status">Yeni sesler hazırlanıyor.</p><p id="preparation" aria-live="polite"></p><div id="cards"></div></main><script>
const voices={pofidik:'Pofidik',kipir:'Kıpır Kunduz',dila:'Dila',mina:'Mina Tilki'};for(const [key,name]of Object.entries(voices)){const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><small>Gönderdiğin ses örneği</small><audio controls src="assets/character-voices/${key}-reference.wav"></audio><small>Yeni üretilen cümle</small><p>Aferin! Çok güzel yaptın. Şimdi birlikte devam edelim.</p><audio controls data-demo="${key}"></audio>`;document.querySelector('#cards').append(a);}async function update(){for(const audio of document.querySelectorAll('[data-demo]')){if(audio.src)continue;const url=`assets/character-voices/${audio.dataset.demo}-demo.wav`;try{const r=await fetch(url,{method:'HEAD'});if(r.ok)audio.src=url;}catch{}}const count=document.querySelectorAll('[data-demo][src]').length;document.querySelector('#status').textContent=count===4?'Dört yeni ses denemesi hazır.':`Yeni ses denemeleri hazırlanıyor · ${count}/4`;if(count<4)setTimeout(update,4000);}document.addEventListener('play',e=>document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();}),true);update();async function prepared(){try{const r=await fetch('assets/character-voices/ready/progress.json',{cache:'no-cache'});if(r.ok){const progress=await r.json();document.getElementById('preparation').textContent='Hazır konuşmalar: '+progress.ready+' / '+progress.total+(progress.ready<progress.total?' · Hazırlık sürüyor.':' · Tamamlandı.');}}catch{}setTimeout(prepared,5000);}prepared();</script></html>
